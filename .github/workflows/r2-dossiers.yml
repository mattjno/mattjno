name: R2 (création des dossiers du site)

# Action ponctuelle : crée les dossiers hero/, football/, handball/, basket/ et football-americain/
# dans le bucket R2. À supprimer une fois passée.

on:
  workflow_dispatch:
  push:
    branches: [design/version-a]
    paths: [".github/workflows/r2-dossiers.yml"]

jobs:
  dossiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i @aws-sdk/client-s3
      - name: Créer les dossiers
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          cat > dossiers.mjs <<'JS'
          import { S3Client, PutObjectCommand, ListObjectsV2Command } from "@aws-sdk/client-s3";
          const s3 = new S3Client({ region: "auto", endpoint: `https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
            credentials: { accessKeyId: process.env.R2_ACCESS_KEY_ID, secretAccessKey: process.env.R2_SECRET_ACCESS_KEY } });
          const Bucket = process.env.R2_BUCKET;
          let failed = false;
          for (const d of ["hero", "football", "handball", "basket", "football-americain"]) {
            try { await s3.send(new PutObjectCommand({ Bucket, Key: `${d}/`, Body: "" })); console.log(`::notice::Dossier créé : ${d}/`); }
            catch (e) { failed = true; console.log(`::error::${d}/ : ${e.name} ${e.$metadata?.httpStatusCode ?? ""} ${e.message}`); }
          }
          const r = await s3.send(new ListObjectsV2Command({ Bucket, Delimiter: "/" })).catch((e) => ({ err: e }));
          console.log(`::notice::Dossiers racine : ${r.err ? r.err.name : (r.CommonPrefixes || []).map((p) => p.Prefix).join(" ")}`);
          process.exit(failed ? 1 : 0);
          JS
          node dossiers.mjs
