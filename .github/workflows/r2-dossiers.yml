name: R2 (création des dossiers du site)

# Action ponctuelle : crée les dossiers hero/, football/, handball/, basket/ et football-americain/
# dans le bucket R2. À supprimer une fois passée.

on:
  workflow_dispatch:
  push:
    branches: [design/version-a]
    paths: [".github/workflows/r2-dossiers.yml"]

jobs:
  dossiers:
    runs-on: ubuntu-latest
    steps:
      - name: Créer les dossiers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          EP="https://${ACCOUNT}.r2.cloudflarestorage.com"
          for d in hero football handball basket football-americain; do
            aws s3api put-object --bucket "$BUCKET" --key "$d/" --content-length 0 --endpoint-url "$EP" > /dev/null
            echo "Dossier créé : $d/"
          done
          aws s3api list-objects-v2 --bucket "$BUCKET" --delimiter "/" --endpoint-url "$EP" --query "CommonPrefixes[].Prefix" --output text
