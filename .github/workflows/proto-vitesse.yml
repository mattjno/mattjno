name: Prototype vitesse (planches et calques)

on:
  workflow_dispatch:
  push:
    branches: [design/motion-proto]
    paths: ["tools/picks.json", "tools/vitesse.py", ".github/workflows/proto-vitesse.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: pip install pillow opencv-python-headless numpy "rembg[cpu]"
      - name: Traitement
        run: python tools/vitesse.py
      - name: Commit des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in tools/out public/proto/vitesse; do if [ -d "$d" ]; then git add "$d"; fi; done
          git diff --cached --quiet || git commit -m "Prototype vitesse : résultats générés"
          git push
